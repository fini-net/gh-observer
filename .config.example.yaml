# Example configuration for gh-observer
# Copy to ~/.config/gh-observer/config.yaml to customize

# Refresh interval for polling GitHub API (single PR/run mode)
refresh_interval: 5s

# Refresh interval for repo mode (--repo flag)
repo_refresh_interval: 30s

# How long completed checks remain visible before fading out (repo mode)
fade_success: 15m  # Successful checks disappear after 15 minutes
fade_failure: 30m  # Failed checks disappear after 30 minutes

# Color codes for terminal output (ANSI 256-color palette)
colors:
  success: 10  # Green - completed successfully
  failure: 9   # Red - completed with failure
  running: 11  # Yellow - currently in progress
  queued: 8    # Gray - waiting to start

# Presumed historical averages for checks that have no Actions workflow run
# to fetch history from (e.g. external GitHub App checks like DCO provided by
# Probot). When such a check appears in the check list, the configured duration
# is shown in the HistAvg column instead of a blank cell. Real history always
# wins: if a workflow run is later found for a check name, that real average
# replaces the presumed value. Keys are matched against the check Name field
# case-insensitively (viper lowercases config map keys, so "DCO" and "dco" are
# equivalent). Durations use Go time.ParseDuration syntax.
presumed_averages:
  DCO: 1s

# Copilot code review detection (issue #409). When enabled (default), the TUI
# gates exit on Copilot review completion in PR mode, mirroring template-repo's
# wait_for_copilot.sh. Copilot reviews don't appear in StatusCheckRollup, so
# without this gh-observer would quit "green" while Copilot is still reviewing.
# Set wait_for_copilot: false for repos that don't use Copilot.
#
# Host capability (issue #442): at startup gh-observer checks whether the
# Copilot reviewer app exists on the host at all. Hosts without it (e.g.
# GitHub Enterprise Server without Copilot code review) never arm the gate,
# never render the Copilot row, and don't query for reviews. Only a
# definitive 404 for the reviewer disables detection; any other error
# (network, auth, 5xx) keeps it enabled. github.com short-circuits to
# enabled without a request (the app is a first-party installation there),
# so this only ever disables detection on enterprise hosts. Note: on
# enterprise setups where SSO or token scope can produce 404s for existing
# users, detection may be disabled conservatively — the per-PR scan
# self-resolves either way, and if you hit this, please open an issue.
#
# The synthetic Copilot row only appears once a poll has positively seen a
# Copilot review request or review on the PR; until then a neutral
# "Checking for Copilot review…" line shows instead.
wait_for_copilot: true

# Maximum total wall-clock time to wait for a Copilot review before giving up:
# the Copilot row/spinner stops updating and gh-observer proceeds, regardless
# of whether Actions checks are still running. Measured from the CI cycle's
# start — the later of the commit's push time and the PR's creation time
# (issue #518) — when known (falling back to PR-info time, i.e. when the head
# SHA is known, only if the anchor never arrives), so it includes the
# initial_delay window below. copilot_max_wait does NOT add to
# copilot_initial_delay — it bounds the whole wait.
copilot_max_wait: 180s

# Polling interval for the Copilot review state query (separate from
# refresh_interval, which governs check-run polling).
copilot_poll_interval: 10s

# Initial delay before the first Copilot review poll, giving GitHub time to
# create the review request after a push. Bounded by copilot_max_wait above
# (the delay counts toward the total wait, it does not add to it). Skipped
# when the CI cycle already predates this window (e.g. attaching to an old
# PR): any review request already exists by then, so polling starts
# immediately.
copilot_initial_delay: 15s

# GitHub Enterprise API endpoints (issues #479/#485/#532). These are
# environment variables rather than config.yaml keys, documented here for
# discoverability. gh-observer derives them from the host, mirroring the
# gh CLI's go-gh library:
#
#   - github.com: library defaults (api.github.com)
#   - *.ghe.com (GitHub Enterprise Cloud tenants): the api.<host>
#     subdomain convention
#   - anything else (GitHub Enterprise Server, custom enterprise domains):
#     the path-based endpoints GHES documents — https://<host>/api/v3
#     for REST and https://<host>/api/graphql for GraphQL
#
# Two environment variables override the derivation for non-github.com
# hosts whose API is not reachable through it — e.g. a GHES install
# that serves only the api.<host> subdomain form, or a reverse proxy:
#
#   GH_OBSERVER_API_URL      overrides both endpoints: REST at <url>/
#                            (go-github appends api/v3 unless the base
#                            already ends in /api/v3) and GraphQL at
#                            <url>/graphql
#   GH_OBSERVER_GRAPHQL_URL  overrides just the GraphQL endpoint and
#                            wins over the URL the API override derives
#
# Together they express split layouts, e.g. a GHES behind a proxy:
#
#   GH_OBSERVER_API_URL=https://ghe.example.com
#   GH_OBSERVER_GRAPHQL_URL=https://ghe.example.com/api/graphql
#
# Values must be https (or plain http on a loopback host): the bearer
# token rides every request to the override targets. Invalid values are
# ignored with a debug log (--debug), and github.com is never redirected.
