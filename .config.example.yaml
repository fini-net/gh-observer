# Example configuration for gh-observer
# Copy to ~/.config/gh-observer/config.yaml to customize

# Refresh interval for polling GitHub API (single PR/run mode)
refresh_interval: 5s

# Refresh interval for repo mode (--repo flag)
repo_refresh_interval: 30s

# How long completed checks remain visible before fading out (repo mode)
fade_success: 15m  # Successful checks disappear after 15 minutes
fade_failure: 30m  # Failed checks disappear after 30 minutes

# Color codes for terminal output (ANSI 256-color palette)
colors:
  success: 10  # Green - completed successfully
  failure: 9   # Red - completed with failure
  running: 11  # Yellow - currently in progress
  queued: 8    # Gray - waiting to start

# Presumed historical averages for checks that have no Actions workflow run
# to fetch history from (e.g. external GitHub App checks like DCO provided by
# Probot). When such a check appears in the check list, the configured duration
# is shown in the HistAvg column instead of a blank cell. Real history always
# wins: if a workflow run is later found for a check name, that real average
# replaces the presumed value. Keys are matched against the check Name field
# case-insensitively (viper lowercases config map keys, so "DCO" and "dco" are
# equivalent). Durations use Go time.ParseDuration syntax.
presumed_averages:
  DCO: 1s

# Copilot code review detection (issue #409). When enabled (default), the TUI
# gates exit on Copilot review completion in PR mode, mirroring template-repo's
# wait_for_copilot.sh. Copilot reviews don't appear in StatusCheckRollup, so
# without this gh-observer would quit "green" while Copilot is still reviewing.
# Set wait_for_copilot: false for repos that don't use Copilot.
wait_for_copilot: true

# Maximum total wall-clock time to wait for a Copilot review before timing out
# and proceeding. Measured from PR-info time (when the head SHA is known), so
# it includes the initial_delay window below. copilot_max_wait does NOT add to
# copilot_initial_delay — it bounds the whole wait.
copilot_max_wait: 180s

# Polling interval for the Copilot review state query (separate from
# refresh_interval, which governs check-run polling).
copilot_poll_interval: 10s

# Initial delay before the first Copilot review poll, giving GitHub time to
# create the review request after a push. Bounded by copilot_max_wait above
# (the delay counts toward the total wait, it does not add to it).
copilot_initial_delay: 15s
