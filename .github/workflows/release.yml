name: Release

on:
  push:
    tags:
      - 'v*'

# empty global permissions
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build cross-platform binaries
        uses: cli/gh-extension-precompile@76961aa3bd1123d0a6fd42d0a41aca0696937c39 # v2.2.0
        with:
          go_version_file: go.mod
          generate_attestations: true

      - name: Generate subject hashes for SLSA provenance
        id: hash
        run: |
          cd dist
          hashes=$(sha256sum darwin-* linux-* freebsd-* windows-* | base64 -w0)
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # cosign v3 writes the new Sigstore bundle format: a single file with
      # the signature, the signing certificate, and the transparency-log
      # entry. --output-signature and --output-certificate are deprecated
      # and silently ignored in this mode, so we pass --bundle only. See
      # https://goreleaser.com/blog/cosign-v3/ for the v3 migration.
      - name: Sign binaries with cosign (keyless)
        run: |
          cd dist
          for binary in darwin-* linux-* freebsd-* windows-*; do
            [[ -f "$binary" ]] || continue
            cosign sign-blob --yes "$binary" \
              --bundle "${binary}.sigstore.json"
          done

      # Run the exact verification we document for users (README "Option 2")
      # before anything is uploaded: a signature that cannot be verified
      # fails the release instead of shipping. Every binary must have a
      # bundle, so a skipped or partial sign step fails loudly too.
      - name: Verify signatures with cosign
        run: |
          cd dist
          binaries=()
          for f in darwin-* linux-* freebsd-* windows-*; do
            if [[ -f "$f" && "$f" != *.sigstore.json ]]; then
              binaries+=("$f")
            fi
          done
          if (( ${#binaries[@]} == 0 )); then
            echo "::error::no binaries found in dist/"
            exit 1
          fi
          rc=0
          for binary in "${binaries[@]}"; do
            bundle="${binary}.sigstore.json"
            if [[ ! -f "$bundle" ]]; then
              echo "::error::missing bundle: $bundle"
              rc=1
              continue
            fi
            cosign verify-blob "$binary" \
              --bundle "$bundle" \
              --certificate-identity-regexp '^https://github\.com/fini-net/gh-observer/\.github/workflows/release\.yml@refs/tags/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              || { echo "::error::verification failed: $binary"; rc=1; }
          done
          exit "$rc"

      # The verify step above already asserted every binary has a bundle, so
      # this list is never empty; --clobber keeps re-runs idempotent.
      - name: Upload cosign bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cd dist
          shopt -s nullglob
          bundles=( *.sigstore.json )
          shopt -u nullglob
          if (( ${#bundles[@]} == 0 )); then
            echo "::error::no .sigstore.json bundles found in dist/"
            exit 1
          fi
          gh release upload "$TAG" "${bundles[@]}" --clobber

  provenance:
    needs: release
    permissions:
      actions: read
      id-token: write
      contents: write
    # SLSA generator requires a tag ref (refs/tags/vX.Y.Z) for its internal builder checkout;
    # pinning to a git SHA causes "Invalid ref" errors and provenance generation failure.
    # See: https://github.com/fini-net/gh-observer/actions/runs/27281001944
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
