name: Auto Assign

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

# global permissions
permissions: {}

jobs:
  run-auto-assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - name: 'Auto-assign issue'
      uses: pozil/auto-assign-issue@d6e511896e5f1d2408e74db74416647d8ff80c8c # v4.1.0
      with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: chicks-net
          numOfAssignee: 1
          allowSelfAssign: true
