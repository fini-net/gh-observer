name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  go-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token for the codecov upload below
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      # publishes the coverage report that the README badge links to,
      # authenticating with a short-lived GitHub OIDC token (audience
      # codecov.io) instead of a long-lived static upload secret
      - name: Upload coverage to Codecov
        # fork PRs and Dependabot PRs can't mint OIDC tokens (GitHub won't
        # grant id-token: write there - it treats Dependabot pull_request
        # runs like forks even though its branches live in this repo), so
        # the upload can't authenticate there - skip the doomed attempt;
        # same-repo PRs (incl. Renovate) and pushes to main still run
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && github.actor != 'dependabot[bot]'
        # fail_ci_if_error: a broken upload (codecov.io outage, etc) reds
        # the CI / go-test check so gh observer reports it and the README
        # badge can't silently go stale; it does not block merging - main's
        # required status checks are only govulncheck, Checkov, and
        # gitleaks - but if CI ever joins that list, a codecov.io outage
        # would then block merges
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
