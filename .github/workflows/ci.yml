name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  go-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      # publishes the coverage report that the README badge links to; requires
      # the ORG_CODECOV_TOKEN secret - an org-level secret (fini-net Settings
      # -> Secrets and variables -> Actions), not a repo-level one - because
      # codecov no longer supports tokenless uploads from CI pushes
      - name: Upload coverage to Codecov
        # fork PRs and Dependabot PRs don't get secrets (GitHub treats
        # Dependabot pull_request runs like forks even though its branches
        # live in this repo), so the upload can't authenticate there -
        # skip the doomed attempt; same-repo PRs (incl. Renovate) and
        # pushes to main still run
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.ORG_CODECOV_TOKEN }}
          disable_search: true
